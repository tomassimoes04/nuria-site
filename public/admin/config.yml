backend:
  name: github
  repo: tomassimoes04/nuria-site
  branch: main
  base_url: https://nuria-site.vercel.app
  auth_endpoint: /api/auth

media_folder: "public/images"
public_folder: "/images"

locale: 'pt'

collections:
  # ---- Link-in-bio (nuria-site.vercel.app) ----
  # Profile
  - name: "profile"
    label: "👤 Perfil"
    files:
      - name: "profile"
        label: "Dados do Perfil"
        file: "src/data/profile.json"
        fields:
          - { label: "Nome", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Bio", name: "bio", widget: "text" }
          - { label: "Foto de Perfil", name: "profileImage", widget: "image" }
          - { label: "Email", name: "email", widget: "string" }

  # Coupons
  - name: "coupons"
    label: "🏷️ Cupões"
    files:
      - name: "coupons"
        label: "Lista de Cupões"
        file: "src/data/coupons.json"
        fields:
          - name: "coupons"
            label: "Cupões"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Marca", name: "brand", widget: "string" }
              - { label: "Código", name: "code", widget: "string" }
              - { label: "Desconto", name: "discount", widget: "string", hint: "Ex: 10% desconto" }
              - { label: "Descrição", name: "description", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "URL da Loja", name: "url", widget: "string" }
              - { label: "Categoria", name: "category", widget: "select", options: ["Moda", "Beleza", "Saúde & Fitness", "Casa", "Tech", "Outros"] }
              - { label: "Destaque?", name: "featured", widget: "boolean", default: false }

  # Products
  - name: "products"
    label: "🛍️ Achados"
    files:
      - name: "products"
        label: "Lista de Produtos"
        file: "src/data/products.json"
        fields:
          - name: "products"
            label: "Produtos"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "Marca", name: "brand", widget: "string" }
              - { label: "Preço", name: "price", widget: "string", hint: "Ex: 29.99€" }
              - { label: "Imagem", name: "image", widget: "image", required: false }
              - { label: "URL (Link Afiliado)", name: "url", widget: "string" }
              - { label: "Categoria", name: "category", widget: "select", options: ["Skincare", "Makeup", "Moda", "Acessórios", "Casa", "Fitness", "Tech", "Outros"] }

  # Pokemon
  - name: "pokemon"
    label: "🎴 Pokémon"
    files:
      - name: "pokemon"
        label: "Coleção Pokémon"
        file: "src/data/pokemon.json"
        fields:
          - name: "pokemon"
            label: "Cartas"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "Set/Coleção", name: "set", widget: "string" }
              - { label: "Número", name: "number", widget: "string", hint: "Ex: 4/102" }
              - { label: "Raridade", name: "rarity", widget: "select", options: ["Common", "Uncommon", "Rare", "Holo Rare", "Ultra Rare", "Secret Rare", "Full Art", "Alt Art"] }
              - { label: "Imagem", name: "image", widget: "image", required: false }
              - { label: "Status", name: "status", widget: "select", options: [{ label: "✓ Tenho", value: "owned" }, { label: "♡ Quero", value: "wishlist" }] }
              - { label: "Notas", name: "notes", widget: "string", required: false }

  # Social Links
  - name: "socials"
    label: "📱 Redes Sociais"
    files:
      - name: "socials"
        label: "Links das Redes"
        file: "src/data/socials.json"
        fields:
          - name: "socials"
            label: "Redes Sociais"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Plataforma", name: "platform", widget: "select", options: ["TikTok", "Instagram", "YouTube", "Pinterest", "Twitter", "Facebook", "LinkedIn"] }
              - { label: "Username", name: "username", widget: "string", hint: "Ex: @nuria" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Ícone", name: "icon", widget: "select", options: ["tiktok", "instagram", "youtube", "pinterest", "twitter", "facebook", "linkedin"] }
              - { label: "Seguidores", name: "followers", widget: "string", hint: "Ex: 50K" }

  # ---- Media kit (/work-with-me) ----

  # Perfil do media kit
  - name: "kit"
    label: "💼 Media kit — perfil"
    files:
      - name: "kit"
        label: "Intro do media kit"
        file: "src/data/kit.json"
        fields:
          - { label: "Nome próprio", name: "name", widget: "string" }
          - { label: "Apelido", name: "surname", widget: "string" }
          - { label: "Saudação", name: "greeting", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Bio (inglês, para marcas)", name: "bio", widget: "text" }
          - { label: "Foto", name: "profileImage", widget: "image" }
          - { label: "Legenda da polaroid", name: "photoCaption", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Disponibilidade", name: "availability", widget: "string" }
          - { label: "Texto do autocolante", name: "stickerText", widget: "text" }
          - label: "Etiquetas"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Texto", name: "label", widget: "string" }
              - { label: "Cor", name: "color", widget: "select", options: ["blush", "mint", "lilac", "butter"] }
          - label: "Números do TikTok (deixa os valores vazios para esconder a secção)"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Título", name: "heading", widget: "string" }
              - { label: "Nota (ex: actualizado em Setembro 2026)", name: "note", widget: "string", required: false }
              - label: "Métricas"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Etiqueta", name: "label", widget: "string" }
                  - { label: "Valor (vazio = escondido)", name: "value", widget: "string", required: false }
                  - { label: "Cor", name: "accent", widget: "select", options: ["blush", "mint", "lilac", "butter", "rose"] }
          - { label: "URL TikTok", name: "tiktok", widget: "string" }
          - { label: "Username TikTok", name: "tiktokHandle", widget: "string" }
          - { label: "URL Instagram", name: "instagram", widget: "string" }
          - { label: "Username Instagram", name: "instagramHandle", widget: "string" }

  # Reels
  - name: "reels"
    label: "🎬 Media kit — reels"
    files:
      - name: "reels"
        label: "Reels e cartão de preços"
        file: "src/data/reels.json"
        fields:
          - label: "Reels"
            name: "reels"
            widget: "list"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - { label: "Pacote", name: "package", widget: "string" }
              - { label: "Duração", name: "length", widget: "string" }
              - { label: "Vídeo (link directo .mp4)", name: "video", widget: "string", required: false }
              - { label: "Poster (imagem)", name: "poster", widget: "image", required: false }
              - { label: "Deslocamento vertical", name: "offsetY", widget: "number", value_type: "int" }
              - { label: "Gradiente — início", name: "gradientFrom", widget: "string" }
              - { label: "Gradiente — fim", name: "gradientTo", widget: "string" }
              - { label: "Card em destaque (só um)", name: "hero", widget: "boolean", default: false }
              - { label: "Selo", name: "badge", widget: "string", required: false }
          - label: "Condições (cartão de preços)"
            name: "terms"
            widget: "list"
            fields:
              - { label: "Campo", name: "label", widget: "string" }
              - { label: "Valor", name: "value", widget: "string" }

  # Preços
  - name: "rates"
    label: "💶 Media kit — preços"
    files:
      - name: "rates"
        label: "Tabela de preços"
        file: "src/data/rates.json"
        fields:
          - { label: "Nota", name: "note", widget: "string" }
          - label: "Pacotes"
            name: "tiers"
            widget: "list"
            fields:
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "O que inclui", name: "deliverables", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
              - { label: "Descrição", name: "description", widget: "text" }
              - { label: "Cor de destaque", name: "accent", widget: "string" }
              - { label: "Cor do contorno", name: "border", widget: "string" }
              - { label: "Inclinação (graus)", name: "tilt", widget: "number", value_type: "float" }
              - { label: "Destacado", name: "featured", widget: "boolean", default: false }
              - { label: "Selo", name: "badge", widget: "string", required: false }

  # Processo
  - name: "process"
    label: "✨ Media kit — como funciona"
    files:
      - name: "process"
        label: "Processo e clientes"
        file: "src/data/process.json"
        fields:
          - label: "Clientes (vazio esconde a faixa)"
            name: "clients"
            widget: "list"
            required: false
            field: { label: "Nome", name: "name", widget: "string" }
          - { label: "Título da secção", name: "heading", widget: "string" }
          - label: "Passos"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Texto", name: "body", widget: "text" }
              - { label: "Frase final", name: "kicker", widget: "string" }
              - { label: "Cor de fundo", name: "background", widget: "string" }
              - { label: "Cor do número", name: "badge", widget: "string" }
              - { label: "Direcção da animação (-1 ou 1)", name: "dir", widget: "number", value_type: "int" }

  # Contacto
  - name: "contact"
    label: "💌 Media kit — contacto"
    files:
      - name: "contact"
        label: "Secção de contacto"
        file: "src/data/contact.json"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string" }
          - { label: "Título", name: "headline", widget: "string" }
          - { label: "Subtítulo", name: "subhead", widget: "string" }
          - { label: "Etiqueta — pacotes", name: "packageLabel", widget: "string" }
          - { label: "Pacotes", name: "packages", widget: "list", field: { label: "Opção", name: "option", widget: "string" } }
          - { label: "Etiqueta — prazos", name: "timelineLabel", widget: "string" }
          - { label: "Prazos", name: "timelines", widget: "list", field: { label: "Opção", name: "option", widget: "string" } }
          - { label: "Linha do DM", name: "dmLine", widget: "string" }
